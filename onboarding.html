<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Банк «Восток» — регистрация</title>
<meta name="theme-color" content="#0A0E13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png" sizes="192x192">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px 16px; }
  .ob { width: 100%; max-width: 640px; }

  .ob-head { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .ob-logo {
    width: 52px; height: 52px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; color: #0A0E13;
    background: var(--gold); flex: 0 0 52px;
    transition: background .18s var(--ease);
  }
  .ob-head h1 { font-size: var(--fs-19); line-height: 1.2; }
  .ob-head p { font-size: var(--fs-11); color: var(--text-3); margin-top: 3px; }

  .ob-steps { margin-left: auto; display: flex; gap: 6px; }
  .ob-steps i { width: 22px; height: 3px; border-radius: 2px; background: var(--border); }
  .ob-steps i.on { background: var(--gold); }

  .ob-pane { display: flex; flex-direction: column; gap: var(--sp-3); }
  .ob-pane[hidden] { display: none; }

  .ob-label { font-size: var(--fs-10); text-transform: uppercase; letter-spacing: .07em; color: var(--text-3); margin-bottom: 6px; display: block; }
  .ob-input {
    width: 100%;
    padding: 12px 14px;
    border-radius: var(--r-m);
    border: 1px solid var(--border);
    background: var(--raised);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: var(--fs-14);
  }
  .ob-input:focus { outline: none; border-color: var(--gold); }
  .ob-error { font-size: var(--fs-10); color: var(--coral); min-height: 12px; }

  .ob-colors { display: flex; gap: 10px; }
  .ob-color {
    width: 38px; height: 38px; border-radius: 50%;
    border: 2px solid transparent; cursor: pointer;
    transition: transform .15s var(--ease), border-color .15s;
  }
  .ob-color:hover { transform: scale(1.06); }
  .ob-color.is-on { border-color: var(--text); }

  .ob-cards { display: grid; gap: 10px; }
  .ob-card {
    text-align: left;
    padding: 14px 16px;
    border-radius: var(--r-l);
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    transition: border-color .15s, background .15s;
    font-family: var(--font-ui);
  }
  .ob-card:hover { border-color: var(--border-strong); }
  .ob-card.is-on { border-color: var(--gold); background: var(--gold-dim); }
  .ob-card b { display: block; font-size: var(--fs-14); margin-bottom: 3px; }
  .ob-card span { font-size: var(--fs-11); color: var(--text-3); line-height: 1.4; }

  .ob-foot { display: flex; align-items: center; gap: 10px; margin-top: 22px; }
  .ob-foot .hint { flex: 1; font-size: var(--fs-11); color: var(--text-3); }
  .ob-foot .btn { min-width: 130px; justify-content: center; }

  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(200, 160, 74, .45); }
    50% { box-shadow: 0 0 0 10px rgba(200, 160, 74, 0); }
  }
</style>
</head>
<body data-page="onboarding">

<div class="ob">
  <header class="ob-head">
    <div class="ob-logo" id="logo">М</div>
    <div>
      <h1>Регистрация банка</h1>
      <p>Четыре шага — и вы в деле</p>
    </div>
    <div class="ob-steps" aria-hidden="true">
      <i data-step="1" class="on"></i><i data-step="2"></i><i data-step="3"></i><i data-step="4"></i>
    </div>
  </header>

  <section class="ob-pane" data-pane="1">
    <div>
      <label class="ob-label" for="name">Название банка</label>
      <input class="ob-input" id="name" maxlength="25" placeholder="Например, Восток" autocomplete="off">
      <div class="ob-error" id="name-err"></div>
    </div>
    <div>
      <label class="ob-label" for="founder">Имя основателя</label>
      <input class="ob-input" id="founder" maxlength="40" placeholder="Как к вам обращаться" autocomplete="off">
      <div class="ob-error" id="founder-err"></div>
    </div>
    <div>
      <span class="ob-label">Цвет логотипа</span>
      <div class="ob-colors" id="colors">
        <button class="ob-color is-on" type="button" data-color="gold" style="background:#C8A04A" aria-label="Латунь"></button>
        <button class="ob-color" type="button" data-color="mint" style="background:#3DDC97" aria-label="Мята"></button>
        <button class="ob-color" type="button" data-color="blue" style="background:#4DA3FF" aria-label="Сталь"></button>
        <button class="ob-color" type="button" data-color="violet" style="background:#9B8CFF" aria-label="Фиалка"></button>
      </div>
    </div>
  </section>

  <section class="ob-pane" data-pane="2" hidden>
    <div class="ob-cards" data-group="spec">
      <button class="ob-card" type="button" data-value="retail">
        <b>Розничный</b>
        <span>Вклады идут охотнее: +20% к шансу вкладов, клиенты менее рискованные (−1 к риску)</span>
      </button>
      <button class="ob-card" type="button" data-value="corporate">
        <b>Корпоративный</b>
        <span>Дороже кредиты: +1,5 п.п. к ставке, но клиенты рискованнее (+1 к риску)</span>
      </button>
      <button class="ob-card" type="button" data-value="universal">
        <b>Универсальный</b>
        <span>Без бонусов и без минусов — ровная игра</span>
      </button>
    </div>
  </section>

  <section class="ob-pane" data-pane="3" hidden>
    <div class="ob-cards" data-group="motiv">
      <button class="ob-card" type="button" data-value="honest">
        <b>Честный банкир</b>
        <span>Репутация 71, но штрафы ЦБ ×1,2 — репутация дороже денег</span>
      </button>
      <button class="ob-card" type="button" data-value="shark">
        <b>Акула рынка</b>
        <span>Стартовый капитал ×1,05, репутация 56 — деньги решают</span>
      </button>
      <button class="ob-card" type="button" data-value="people">
        <b>Народный банк</b>
        <span>Поток клиентов ×1,2, но маржа ×0,9 — работаем на объём</span>
      </button>
    </div>
  </section>

  <section class="ob-pane" data-pane="4" hidden>
    <div class="ob-cards" data-group="diff">
      <button class="ob-card" type="button" data-value="normal">
        <b>Нормальный</b>
        <span>8,42 млн ₽, проверка ЦБ раз в 180 дней</span>
      </button>
      <button class="ob-card" type="button" data-value="hardcore">
        <b>Хардкор</b>
        <span>5 млн ₽, проверка раз в 90 дней, штрафы ×2</span>
      </button>
      <button class="ob-card" type="button" data-value="sandbox">
        <b>Песочница</b>
        <span>50 млн ₽, проверки ЦБ отключены — стройте спокойно</span>
      </button>
    </div>
  </section>

  <footer class="ob-foot">
    <button class="btn btn-ghost" type="button" data-back disabled>Назад</button>
    <span class="hint" data-hint></span>
    <button class="btn btn-primary" type="button" data-next disabled>Далее</button>
  </footer>
</div>

<script src="js/state.js"></script>
<script>
(function () {
  var pick = { bankName: '', founderName: '', logoColor: 'gold', spec: null, motiv: null, diff: null };
  var step = 1;

  var logo = document.getElementById('logo');
  var nameInput = document.getElementById('name');
  var founderInput = document.getElementById('founder');
  var nameErr = document.getElementById('name-err');
  var founderErr = document.getElementById('founder-err');
  var nextBtn = document.querySelector('[data-next]');
  var backBtn = document.querySelector('[data-back]');
  var hint = document.querySelector('[data-hint]');

  var COLOR_HEX = { gold: '#C8A04A', mint: '#3DDC97', blue: '#4DA3FF', violet: '#9B8CFF' };

  function nameOk() {
    var v = nameInput.value.trim();
    return v.length >= 3 && v.length <= 25;
  }

  function founderOk() {
    var v = founderInput.value.trim();
    return v.length >= 2 && v.length <= 40;
  }

  function stepOk() {
    if (step === 1) return nameOk() && founderOk();
    if (step === 2) return !!pick.spec;
    if (step === 3) return !!pick.motiv;
    return !!pick.diff;
  }

  function refresh() {
    var first = nameInput.value.trim().charAt(0).toUpperCase();
    logo.textContent = first || 'М';
    logo.style.background = COLOR_HEX[pick.logoColor] || COLOR_HEX.gold;

    nameErr.textContent = nameInput.value.trim() && !nameOk() ? 'От 3 до 25 символов' : '';
    founderErr.textContent = founderInput.value.trim() && !founderOk() ? 'От 2 до 40 символов' : '';

    document.querySelectorAll('.ob-pane').forEach(function (pane) {
      pane.hidden = Number(pane.dataset.pane) !== step;
    });

    document.querySelectorAll('.ob-steps i').forEach(function (dot) {
      dot.classList.toggle('on', Number(dot.dataset.step) <= step);
    });

    backBtn.disabled = step === 1;
    nextBtn.disabled = !stepOk();

    if (step === 4) {
      nextBtn.textContent = 'Зарегистрировать банк';
      nextBtn.classList.add('pulse');
    } else {
      nextBtn.textContent = 'Далее';
      nextBtn.classList.remove('pulse');
    }

    hint.textContent = step === 4
      ? (nextBtn.disabled ? 'Выберите сложность' : 'Всё готово')
      : 'Шаг ' + step + ' из 4';
  }

  nameInput.addEventListener('input', refresh);
  founderInput.addEventListener('input', refresh);

  document.getElementById('colors').addEventListener('click', function (event) {
    var btn = event.target.closest('[data-color]');
    if (!btn) return;
    pick.logoColor = btn.dataset.color;
    document.querySelectorAll('[data-color]').forEach(function (b) {
      b.classList.toggle('is-on', b === btn);
    });
    refresh();
  });

  document.querySelectorAll('[data-group]').forEach(function (group) {
    group.addEventListener('click', function (event) {
      var card = event.target.closest('[data-value]');
      if (!card) return;

      group.querySelectorAll('[data-value]').forEach(function (c) {
        c.classList.toggle('is-on', c === card);
      });

      var key = group.dataset.group;
      pick[key] = card.dataset.value;
      refresh();
    });
  });

  backBtn.addEventListener('click', function () {
    if (step > 1) { step -= 1; refresh(); }
  });

  nextBtn.addEventListener('click', function () {
    if (!stepOk()) return;

    if (step < 4) {
      step += 1;
      refresh();
      return;
    }

    GameState.applyOnboarding({
      bankName: nameInput.value.trim(),
      founderName: founderInput.value.trim(),
      logoColor: pick.logoColor,
      spec: pick.spec,
      motiv: pick.motiv,
      diff: pick.diff
    });

    window.location.href = 'index.html';
  });

  refresh();
})();
</script>
</body>
</html>
