<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Банк «Восток» — регистрация</title>
<meta name="theme-color" content="#0A0E13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png" sizes="192x192">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<style>
  body { display: flex; justify-content: center; min-height: 100vh; padding: 24px 16px; }
  .ob { margin: auto; }
  .ob { width: 100%; max-width: 760px; }

  .ob-head { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .ob-logo {
    width: 52px; height: 52px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; color: #0A0E13;
    background: var(--gold); flex: 0 0 52px;
    transition: background .18s var(--ease);
  }
  .ob-head h1 { font-size: var(--fs-19); line-height: 1.2; }
  .ob-head p { font-size: var(--fs-11); color: var(--text-3); margin-top: 3px; }

  .ob-steps { margin-left: auto; display: flex; gap: 6px; }
  .ob-steps i { width: 22px; height: 3px; border-radius: 2px; background: var(--border); }
  .ob-steps i.on { background: var(--gold); }

  .ob-pane { display: flex; flex-direction: column; gap: var(--sp-3); }
  .ob-pane[hidden] { display: none; }

  .ob-label { font-size: var(--fs-10); text-transform: uppercase; letter-spacing: .07em; color: var(--text-3); margin-bottom: 6px; display: block; }
  .ob-input {
    width: 100%;
    padding: 12px 14px;
    border-radius: var(--r-m);
    border: 1px solid var(--border);
    background: var(--raised);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: var(--fs-14);
  }
  .ob-input:focus { outline: none; border-color: var(--gold); }
  .ob-error { font-size: var(--fs-10); color: var(--coral); min-height: 12px; }

  .ob-colors { display: flex; gap: 10px; }
  .ob-color {
    width: 38px; height: 38px; border-radius: 50%;
    border: 2px solid transparent; cursor: pointer;
    transition: transform .15s var(--ease), border-color .15s;
  }
  .ob-color:hover { transform: scale(1.06); }
  .ob-color.is-on { border-color: var(--text); }

  .ob-cards { display: grid; gap: 10px; }
  .ob-card {
    text-align: left;
    padding: 14px 16px;
    border-radius: var(--r-l);
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    transition: border-color .15s, background .15s;
    font-family: var(--font-ui);
  }
  .ob-card:hover { border-color: var(--border-strong); }
  .ob-card.is-on { border-color: var(--gold); background: var(--gold-dim); }
  .ob-card b { display: block; font-size: var(--fs-14); margin-bottom: 3px; }
  .ob-card span { font-size: var(--fs-11); color: var(--text-3); line-height: 1.4; }

  .ob-foot { display: flex; align-items: center; gap: 10px; margin-top: 22px; }
  .ob-foot .hint { flex: 1; font-size: var(--fs-11); color: var(--text-3); }
  .ob-foot .btn { min-width: 130px; justify-content: center; }

  .ob-icons {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-top: 10px;
  }
  .ob-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 46px;
    border-radius: var(--r-m);
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text-2);
    cursor: pointer;
    transition: border-color .15s, color .15s, background .15s;
  }
  .ob-icon:hover { border-color: var(--border-strong); color: var(--text); }
  .ob-icon.is-on { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }

  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(200, 160, 74, .45); }
    50% { box-shadow: 0 0 0 10px rgba(200, 160, 74, 0); }
  }
</style>
</head>
<body data-page="onboarding">

<div class="ob">
  <header class="ob-head">
    <div class="ob-logo" id="logo">М</div>
    <div>
      <h1>Регистрация банка</h1>
      <p>Четыре шага — и вы в деле</p>
    </div>
    <div class="ob-steps" aria-hidden="true">
      <i data-step="1" class="on"></i><i data-step="2"></i><i data-step="3"></i><i data-step="4"></i>
    </div>
  </header>

  <section class="ob-pane" data-pane="1">
    <div>
      <label class="ob-label" for="name">Название банка</label>
      <input class="ob-input" id="name" maxlength="25" placeholder="Например, Восток" autocomplete="off">
      <div class="ob-error" id="name-err"></div>
    </div>
    <div>
      <label class="ob-label" for="founder">Имя основателя</label>
      <input class="ob-input" id="founder" maxlength="40" placeholder="Как к вам обращаться" autocomplete="off">
      <div class="ob-error" id="founder-err"></div>
    </div>
    <div>
      <span class="ob-label">Эмблема</span>
      <div class="segmented" id="logotype" role="tablist">
        <button type="button" class="is-on" data-logotype="letter">Буква</button>
        <button type="button" data-logotype="icon">Символ</button>
      </div>
      <div class="ob-icons" id="icons" hidden></div>
    </div>
    <div>
      <span class="ob-label">Цвет эмблемы</span>
      <div class="ob-colors" id="colors">
        <button class="ob-color is-on" type="button" data-color="gold" style="background:#C8A04A" aria-label="Латунь"></button>
        <button class="ob-color" type="button" data-color="mint" style="background:#3DDC97" aria-label="Мята"></button>
        <button class="ob-color" type="button" data-color="blue" style="background:#4DA3FF" aria-label="Сталь"></button>
        <button class="ob-color" type="button" data-color="violet" style="background:#9B8CFF" aria-label="Фиалка"></button>
      </div>
    </div>
  </section>

  <section class="ob-pane" data-pane="2" hidden>
    <div class="ob-cards" data-group="spec">
      <button class="ob-card" type="button" data-value="retail">
        <span class="ob-ico">🏦</span>
        <span class="ob-card-body">
          <b>Розничный</b>
          <span class="ob-desc">Вклады идут охотнее, клиенты спокойнее</span>
          <span class="ob-pro">+20% к вкладам · риск −1</span>
          <span class="ob-con">маржа по кредитам −5%</span>
        </span>
      </button>
      <button class="ob-card" type="button" data-value="corporate">
        <span class="ob-ico">🏢</span>
        <span class="ob-card-body">
          <b>Корпоративный</b>
          <span class="ob-desc">Дорогие кредиты для бизнеса</span>
          <span class="ob-pro">+15% к ставке по кредитам</span>
          <span class="ob-con">риск +1 · поток −10%</span>
        </span>
      </button>
      <button class="ob-card" type="button" data-value="universal">
        <span class="ob-ico">🌍</span>
        <span class="ob-card-body">
          <b>Универсальный</b>
          <span class="ob-desc">Ровная игра без перекосов</span>
          <span class="ob-pro">без штрафов</span>
          <span class="ob-con">без бонусов</span>
        </span>
      </button>
      <button class="ob-card" type="button" data-value="mortgage">
        <span class="ob-ico">💳</span>
        <span class="ob-card-body">
          <b>Ипотечный</b>
          <span class="ob-desc">Длинные и крупные кредиты</span>
          <span class="ob-pro">+25% к сумме кредитов · срок +12 мес.</span>
          <span class="ob-con">риск +1</span>
        </span>
      </button>
      <button class="ob-card" type="button" data-value="investment">
        <span class="ob-ico">📈</span>
        <span class="ob-card-body">
          <b>Инвестиционный</b>
          <span class="ob-desc">Ставка на купоны и валюту</span>
          <span class="ob-pro">+10% к купонам · валюта волатильнее</span>
          <span class="ob-con">поток клиентов −15%</span>
        </span>
      </button>
      <button class="ob-card" type="button" data-value="micro">
        <span class="ob-ico">🏧</span>
        <span class="ob-card-body">
          <b>Микрозаймы</b>
          <span class="ob-desc">Много мелких займов</span>
          <span class="ob-pro">+50% к потоку клиентов</span>
          <span class="ob-con">риск +2 · сумма кредита −40%</span>
        </span>
      </button>
      <button class="ob-card" type="button" data-value="vip">
        <span class="ob-ico">💎</span>
        <span class="ob-card-body">
          <b>VIP-банк</b>
          <span class="ob-desc">Крупные клиенты приходят чаще</span>
          <span class="ob-pro">+30% к шансу VIP-заявок</span>
          <span class="ob-con">зарплаты менеджеров +20%</span>
        </span>
      </button>
      <button class="ob-card" type="button" data-value="currency">
        <span class="ob-ico">🌐</span>
        <span class="ob-card-body">
          <b>Валютный</b>
          <span class="ob-desc">Зарабатываем на спреде</span>
          <span class="ob-pro">+15% к спреду · +10% капитала в валюте</span>
          <span class="ob-con">проверки ЦБ раз в 120 дней</span>
        </span>
      </button>
      <button class="ob-card" type="button" data-value="construction">
        <span class="ob-ico">🏗</span>
        <span class="ob-card-body">
          <b>Строительный</b>
          <span class="ob-desc">Финансируем стройку</span>
          <span class="ob-pro">+20% к сумме кредитов</span>
          <span class="ob-con">дефолт забирает всё тело кредита</span>
        </span>
      </button>
      <button class="ob-card" type="button" data-value="cooperative">
        <span class="ob-ico">🤝</span>
        <span class="ob-card-body">
          <b>Кооперативный</b>
          <span class="ob-desc">Люди важнее денег</span>
          <span class="ob-pro">+15 к лояльности менеджеров</span>
          <span class="ob-con">зарплаты +10% · поток −5%</span>
        </span>
      </button>
    </div>
  </section>

  <section class="ob-pane" data-pane="3" hidden>
    <div class="ob-cards" data-group="motiv">
      <button class="ob-card" type="button" data-value="honest">
        <span class="ob-ico">🤵</span>
        <span class="ob-card-body">
          <b>Честный банкир</b>
          <span class="ob-desc">Репутация дороже денег</span>
          <span class="ob-pro">репутация +10</span>
          <span class="ob-con">штрафы ЦБ ×1,2</span>
        </span>
      </button>
      <button class="ob-card" type="button" data-value="shark">
        <span class="ob-ico">🦈</span>
        <span class="ob-card-body">
          <b>Акула рынка</b>
          <span class="ob-desc">Деньги решают всё</span>
          <span class="ob-pro">капитал ×1,05</span>
          <span class="ob-con">репутация −5</span>
        </span>
      </button>
      <button class="ob-card" type="button" data-value="people">
        <span class="ob-ico">🏘</span>
        <span class="ob-card-body">
          <b>Народный банк</b>
          <span class="ob-desc">Работаем на объём</span>
          <span class="ob-pro">поток клиентов +20%</span>
          <span class="ob-con">маржа ×0,9</span>
        </span>
      </button>
      <button class="ob-card" type="button" data-value="aristocrat">
        <span class="ob-ico">🎩</span>
        <span class="ob-card-body">
          <b>Аристократ</b>
          <span class="ob-desc">Имя банка работает на нас</span>
          <span class="ob-pro">репутация +15</span>
          <span class="ob-con">зарплаты менеджеров +15%</span>
        </span>
      </button>
      <button class="ob-card" type="button" data-value="analyst">
        <span class="ob-ico">🧠</span>
        <span class="ob-card-body">
          <b>Аналитик</b>
          <span class="ob-desc">Считаем наперёд</span>
          <span class="ob-pro">точность прогнозов +20%</span>
          <span class="ob-con">поток клиентов −10%</span>
        </span>
      </button>
      <button class="ob-card" type="button" data-value="risky">
        <span class="ob-ico">🔥</span>
        <span class="ob-card-body">
          <b>Рисковый игрок</b>
          <span class="ob-desc">Кто не рискует, тот не банкир</span>
          <span class="ob-pro">шанс выиграть на бирже +10%</span>
          <span class="ob-con">риск дефолта +1</span>
        </span>
      </button>
      <button class="ob-card" type="button" data-value="conservative">
        <span class="ob-ico">🛡</span>
        <span class="ob-card-body">
          <b>Консерватор</b>
          <span class="ob-desc">Тише едешь — дальше будешь</span>
          <span class="ob-pro">риск дефолта −1</span>
          <span class="ob-con">поток клиентов −15%</span>
        </span>
      </button>
      <button class="ob-card" type="button" data-value="careerist">
        <span class="ob-ico">💼</span>
        <span class="ob-card-body">
          <b>Карьерист</b>
          <span class="ob-desc">Растим людей быстро</span>
          <span class="ob-pro">рост менеджеров +20%</span>
          <span class="ob-con">зарплаты +10%</span>
        </span>
      </button>
      <button class="ob-card" type="button" data-value="expansionist">
        <span class="ob-ico">🌍</span>
        <span class="ob-card-body">
          <b>Экспансионист</b>
          <span class="ob-desc">Сеть важнее прибыли</span>
          <span class="ob-pro">филиал дешевле на 20%</span>
          <span class="ob-con">проверки ЦБ раз в 150 дней</span>
        </span>
      </button>
      <button class="ob-card" type="button" data-value="ludoman">
        <span class="ob-ico">🎲</span>
        <span class="ob-card-body">
          <b>Лудоман</b>
          <span class="ob-desc">Живём от баффа до баффа</span>
          <span class="ob-pro">шанс баффа +10%</span>
          <span class="ob-con">лояльность падает на 20% быстрее</span>
        </span>
      </button>
    </div>
  </section>

  <section class="ob-pane" data-pane="4" hidden>
    <div class="ob-cards" data-group="diff">
      <button class="ob-card" type="button" data-value="normal">
        <b>Нормальный</b>
        <span>8,42 млн ₽, проверка ЦБ раз в 180 дней</span>
      </button>
      <button class="ob-card" type="button" data-value="hardcore">
        <b>Хардкор</b>
        <span>5 млн ₽, проверка раз в 90 дней, штрафы ×2</span>
      </button>
      <button class="ob-card" type="button" data-value="sandbox">
        <b>Песочница</b>
        <span>50 млн ₽, проверки ЦБ отключены — стройте спокойно</span>
      </button>
    </div>
  </section>

  <footer class="ob-foot">
    <button class="btn btn-ghost" type="button" data-back disabled>Назад</button>
    <span class="hint" data-hint></span>
    <button class="btn btn-primary" type="button" data-next disabled>Далее</button>
  </footer>
</div>

<script src="js/state.js"></script>
<script>
(function () {
  var pick = {
    bankName: '', founderName: '', logoColor: 'gold',
    logoType: 'letter', logoIcon: 'shield',
    spec: null, motiv: null, diff: null
  };
  var step = 1;

  var logo = document.getElementById('logo');
  var nameInput = document.getElementById('name');
  var founderInput = document.getElementById('founder');
  var nameErr = document.getElementById('name-err');
  var founderErr = document.getElementById('founder-err');
  var nextBtn = document.querySelector('[data-next]');
  var backBtn = document.querySelector('[data-back]');
  var hint = document.querySelector('[data-hint]');

  var COLOR_HEX = { gold: '#C8A04A', mint: '#3DDC97', blue: '#4DA3FF', violet: '#9B8CFF' };

  var iconsBox = document.getElementById('icons');
  var logotypeBox = document.getElementById('logotype');

  /* сетку иконок собираем из общего набора в state.js */
  GameState.logoIconsList().forEach(function (id) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'ob-icon' + (id === pick.logoIcon ? ' is-on' : '');
    btn.dataset.icon = id;
    btn.setAttribute('aria-label', id);
    btn.innerHTML = GameState.logoIconSvg(id, 20);
    iconsBox.appendChild(btn);
  });

  logotypeBox.addEventListener('click', function (event) {
    var btn = event.target.closest('[data-logotype]');
    if (!btn) return;
    pick.logoType = btn.dataset.logotype;
    logotypeBox.querySelectorAll('[data-logotype]').forEach(function (b) {
      b.classList.toggle('is-on', b === btn);
    });
    refresh();
  });

  iconsBox.addEventListener('click', function (event) {
    var btn = event.target.closest('[data-icon]');
    if (!btn) return;
    pick.logoIcon = btn.dataset.icon;
    iconsBox.querySelectorAll('[data-icon]').forEach(function (b) {
      b.classList.toggle('is-on', b === btn);
    });
    refresh();
  });

  function nameOk() {
    var v = nameInput.value.trim();
    return v.length >= 3 && v.length <= 25;
  }

  function founderOk() {
    var v = founderInput.value.trim();
    return v.length >= 2 && v.length <= 40;
  }

  function stepOk() {
    if (step === 1) return nameOk() && founderOk();
    if (step === 2) return !!pick.spec;
    if (step === 3) return !!pick.motiv;
    return !!pick.diff;
  }

  function refresh() {
    var first = nameInput.value.trim().charAt(0).toUpperCase();
    var color = COLOR_HEX[pick.logoColor] || COLOR_HEX.gold;

    if (pick.logoType === 'icon') {
      logo.textContent = '';
      logo.innerHTML = GameState.logoIconSvg(pick.logoIcon, 32);
      logo.style.background = 'rgba(255,255,255,.07)';
      logo.style.color = color;
    } else {
      logo.innerHTML = '';
      logo.textContent = first || '?';
      logo.style.background = color;
      logo.style.color = '#0A0E13';
    }

    iconsBox.hidden = pick.logoType !== 'icon';

    nameErr.textContent = nameInput.value.trim() && !nameOk() ? 'От 3 до 25 символов' : '';
    founderErr.textContent = founderInput.value.trim() && !founderOk() ? 'От 2 до 40 символов' : '';

    document.querySelectorAll('.ob-pane').forEach(function (pane) {
      pane.hidden = Number(pane.dataset.pane) !== step;
    });

    document.querySelectorAll('.ob-steps i').forEach(function (dot) {
      dot.classList.toggle('on', Number(dot.dataset.step) <= step);
    });

    backBtn.disabled = step === 1;
    nextBtn.disabled = !stepOk();

    if (step === 4) {
      nextBtn.textContent = 'Зарегистрировать банк';
      nextBtn.classList.add('pulse');
    } else {
      nextBtn.textContent = 'Далее';
      nextBtn.classList.remove('pulse');
    }

    hint.textContent = step === 4
      ? (nextBtn.disabled ? 'Выберите сложность' : 'Всё готово')
      : 'Шаг ' + step + ' из 4';
  }

  nameInput.addEventListener('input', refresh);
  founderInput.addEventListener('input', refresh);

  document.getElementById('colors').addEventListener('click', function (event) {
    var btn = event.target.closest('[data-color]');
    if (!btn) return;
    pick.logoColor = btn.dataset.color;
    document.querySelectorAll('[data-color]').forEach(function (b) {
      b.classList.toggle('is-on', b === btn);
    });
    refresh();
  });

  document.querySelectorAll('[data-group]').forEach(function (group) {
    group.addEventListener('click', function (event) {
      var card = event.target.closest('[data-value]');
      if (!card) return;

      group.querySelectorAll('[data-value]').forEach(function (c) {
        c.classList.toggle('is-on', c === card);
      });

      var key = group.dataset.group;
      pick[key] = card.dataset.value;
      refresh();
    });
  });

  backBtn.addEventListener('click', function () {
    if (step > 1) { step -= 1; refresh(); }
  });

  nextBtn.addEventListener('click', function () {
    if (!stepOk()) return;

    if (step < 4) {
      step += 1;
      refresh();
      return;
    }

    GameState.applyOnboarding({
      bankName: nameInput.value.trim(),
      founderName: founderInput.value.trim(),
      logoColor: pick.logoColor,
      logoType: pick.logoType,
      logoIcon: pick.logoIcon,
      spec: pick.spec,
      motiv: pick.motiv,
      diff: pick.diff
    });

    window.location.href = 'index.html';
  });

  refresh();
})();
</script>
</body>
</html>
