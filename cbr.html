<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Банк «Восток» — Проверка ЦБ</title>
<meta name="theme-color" content="#0A0E13">
<meta name="description" content="Проверка ЦБ — прототип интерфейса">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<script>try{if(!localStorage.getItem('bank-save'))location.replace('onboarding.html');}catch(e){}</script>
<script>try{var d=localStorage.getItem('bank-density');if(d)document.documentElement.dataset.density=d;}catch(e){}</script>
</head>
<body data-page="cbr">

<svg class="sr-only" aria-hidden="true" focusable="false">
  <symbol id="i-scale" viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M6 21h12"/><path d="M4 8h16"/><path d="M4 8l-2 5a3 3 0 0 0 6 0z"/><path d="M20 8l-2 5a3 3 0 0 0 6 0z" transform="translate(-4,0)"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 16H6l1.4-2.1A4 4 0 0 0 8 11.7V10a4 4 0 0 1 8 0v1.7c0 .8.2 1.6.6 2.2z"/><path d="M10.5 19a1.6 1.6 0 0 0 3 0"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
</svg>

<div class="app">

  <header class="hud">
    <div class="brand">
      <div class="brand-mark">В</div>
      <div>
        <div class="brand-name" data-ui="bankname">БАНК «ВОСТОК»</div>
        <div class="brand-stage" data-ui="stage">Ларёк · день 41</div>
      </div>
    </div>

    <div class="clock"><b data-ui="date">14 мар 2027</b><span data-ui="dayline">09:40 · день 41</span></div>

    <div class="paused-plate">
      <svg class="ic" style="width:13px;height:13px"><use href="#i-alert"/></svg>
      Игра на паузе
    </div>

    <div class="hud-stats">
      <div class="hud-stat" title="Свободные деньги: можно выдать кредит или вернуть вклад">
        <span>Доступно</span>
        <b class="num" data-ui="liquid">8,42 млн ₽</b>
      </div>
      <div class="hud-stat">
        <span>Репутация</span>
        <b class="num" data-ui="reputation">61</b>
        <div class="mini-bar"><i data-ui="rep-bar" style="width:61%"></i></div>
      </div>
    </div>
  </header>

  <header class="hud-m">
    <div class="hud-m-top">
      <div class="brand">
        <div class="brand-mark">В</div>
        <div>
          <div class="brand-name" data-ui="bankname">БАНК «ВОСТОК»</div>
          <div class="brand-stage" data-ui="stage">Ларёк · день 41</div>
        </div>
      </div>
      <div class="hud-m-cap">
        <span>Доступно</span>
        <b class="num" data-ui="liquid">8,42 млн ₽</b>
      </div>
    </div>
    <div class="hud-m-bot">
      <span class="clock"><b>09:40</b></span>
      <span class="paused-plate" style="margin-left:auto">
        <svg class="ic" style="width:12px;height:12px"><use href="#i-alert"/></svg>
        Пауза
      </span>
    </div>
  </header>

  <div class="shell">
    <main class="main">
      <div class="page">
        <div class="cbr">

          <div class="cbr-head">
            <div class="cbr-title">
              <svg class="ic" style="width:20px;height:20px"><use href="#i-alert"/></svg>
              ПРОВЕРКА ЦБ РФ
            </div>
            <div class="cbr-meta" data-ui="cbr-meta">…</div>
            <div class="ml-auto row" style="gap:8px">
              <span class="badge badge-amber">игра на паузе</span>
              <span class="badge badge-coral" data-ui="cbr-count">—</span>
            </div>
          </div>

          <div class="stepper" data-ui="cbr-steps"></div>

          <div data-ui="cbr-body"></div>

        </div>
      </div>
    </main>
  </div>

</div>

<script src="js/state.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/prototype.js"></script>
</body>
</html>
